name: catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fails if skills-catalog.json or the README skills table are out of date,
      # or if any skill is missing required fields. Regenerate with: npm run build:catalog
      - run: node scripts/build-catalog.mjs --check
